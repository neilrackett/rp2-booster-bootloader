name: Build

# Trigger when a pull request is received
on:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v3

    - name: Host tests (the firmware's pure logic, under ASan and UBSan)
      run: make -C tests/host test

    - name: Known bugs (each bug_*.c must still fail until its fix renames it)
      run: make -C tests/host known-bugs

  build:
    runs-on: ${{ matrix.os }}
    env:
      STCMD_NO_TTY: 1
    strategy:
      matrix:
        python-version: [ "3.10" ]
        include:
          - os: ubuntu-latest
    steps:  
    - name: Checkout the code
      uses: actions/checkout@v3
  
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the Pico Toolchain
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential libstdc++-arm-none-eabi-newlib
    
    - name: Install AtariST Toolkit Docker image
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.2.1/install_atarist_toolkit_docker.sh | bash

    - name: Run - Build PICO_W release version
      run: ./build.sh pico_w release image

    - name: Run - Build PICO_W debug version
      run: ./build.sh pico_w debug
